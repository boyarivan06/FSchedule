services:
  db:
    image: postgres:16-alpine
    container_name: fschedule_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - fschedule_net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fschedule_app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Хост — имя сервиса `db`, а не localhost!
      DATABASE_URL: "postgres://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}?sslmode=disable"
      APP_PORT: "8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - fschedule_net
  migrate:
    image: migrate/migrate
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations
    command: >
      -path=/migrations
      -database postgres://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}?sslmode=disable
      up
    networks:
      - fschedule_net
volumes:
  pgdata:

networks:
  fschedule_net:
    driver: bridge
